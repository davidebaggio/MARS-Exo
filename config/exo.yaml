exo_depth_preprocessor:
  ros__parameters:
    input_depth_topic: "/camera/exo/aligned_depth_to_color/image_raw"
    output_depth_topic: "/exo/filtered/depth_raw"
    depth_filter.enabled: true
    depth_filter.depth_unit_scale: 0.001
    depth_filter.spatial.kernel_size: 5
    depth_filter.spatial.sigma_color: 0.08
    depth_filter.spatial.sigma_space: 3.0
    depth_filter.temporal.enabled: true
    depth_filter.temporal.alpha: 0.6

exo_semantic_masker:
  ros__parameters:
    input_rgb_topic: "/camera/exo/color/image_raw"
    input_depth_topic: "/exo/filtered/depth_raw"
    output_rgb_topic: "/exo/masked/image_raw"
    output_depth_topic: "/exo/masked/depth_raw"
    masker.model_path: "yolov8n-seg.pt"
    masker.conf_threshold: 0.25
    masker.dynamic_classes: [0, 1, 2, 3, 5, 7]

exo_nvblox:
  ros__parameters:
    depth_topic: "/exo/masked/depth_raw"
    camera_info_topic: "/camera/exo/color/camera_info"