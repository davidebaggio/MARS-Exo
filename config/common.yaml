extrinsic_solver:
  ros__parameters:
    matcher_type: "lightglue"
    lightglue_device: "cuda"
    lightglue_max_keypoints: 2048
    head_rgb_topic: "/head/masked/image_raw"
    head_depth_topic: "/head/masked/depth_raw"
    exo_rgb_topic: "/exo/masked/image_raw"
    exo_depth_topic: "/exo/masked/depth_raw"
    head_camera_info_topic: "/camera/head/color/camera_info"
    exo_camera_info_topic: "/camera/exo/color/camera_info"
    head_frame_id: "head_link"
    exo_frame_id: "exo_link"
    min_3d_matches: 15
    tf_filter_alpha: 0.5
    metrics_enabled: true
    metrics_csv_path: "extrinsic_metrics.csv"
    gt_parent_frame: ""
    gt_child_frame: ""
    imu_gravity_constraint.enabled: true
    imu_gravity_constraint.threshold_deg: 15.0
    head_gravity_topic: "/imu/head/gravity"
    exo_gravity_topic: "/imu/exo/gravity"
    imu_gyro_propagation.enabled: true
    imu_gyro_propagation.max_duration: 5.0
    head_gyro_topic: "/imu/head/gyro_filtered"
    exo_gyro_topic: "/imu/exo/gyro_filtered"

imu_integrator:
  ros__parameters:
    head_imu_topic: "/camera/head/imu"
    exo_imu_topic: "/camera/exo/imu"
    window_size: 100
    gravity_alpha: 0.1
    motion_gyro_threshold: 0.3
    motion_accel_var_threshold: 0.5
    bias_estimation_samples: 100
    process_rate_hz: 10.0