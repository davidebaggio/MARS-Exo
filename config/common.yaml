sequence_pair_adapter:
  ros__parameters:
    max_pair_interval: 0.5 # never couple images across recording/dropout gaps

semantic_masker:
  ros__parameters:
    head.input_rgb_topic: "/camera/head/color/image_raw"
    head.input_depth_topic: "/head/filtered/depth_raw"
    head.output_rgb_topic: "/head/masked/image_raw"
    head.output_depth_topic: "/head/masked/depth_raw"
    head.conf_threshold: 0.25
    head.dynamic_classes: [0, 1, 2, 3, 5, 7]
    exo.input_rgb_topic: "/camera/exo/color/image_raw"
    exo.input_depth_topic: "/exo/filtered/depth_raw"
    exo.output_rgb_topic: "/exo/masked/image_raw"
    exo.output_depth_topic: "/exo/masked/depth_raw"
    exo.conf_threshold: 0.20
    exo.dynamic_classes: [0, 1, 2, 3, 5, 7]
    masker.model_path: "yolov8n-seg.pt"
    mask_dilation_px: 5
    sync_slop: 0.035

extrinsic_solver:
  ros__parameters:
    head_rgb_topic: "/head/masked/image_raw"
    head_depth_topic: "/head/masked/depth_raw"
    exo_rgb_topic: "/exo/masked/image_raw"
    exo_depth_topic: "/exo/masked/depth_raw"
    head_camera_info_topic: "/camera/head/color/camera_info"
    exo_camera_info_topic: "/camera/exo/color/camera_info"
    head_frame_id: "head_link"
    exo_frame_id: "exo_link"
    tf_filter_alpha: 1.0
    sliding_window_size: 4
    max_trans_jump: 0.0 # overlap/scale gates replace lag-prone per-frame jump rejection
    max_rot_jump: 0.0
    validate_rig_geometry: true # fixed head/exo baseline and relative-height bounds
    # VGGT depth-head confidence gating
    depth_conf_mode: "percentile" # "percentile" | "absolute"
    depth_conf_percentile: 20.0 # official VGGT-Omega visualizer default
    depth_conf_absolute: 1.5 # conf threshold when mode=absolute (range is (1, +inf))
    conf_gate_combine: true # gate raw+VGGT depth fill by conf mask
    conf_filter_pointcloud: true # percentile-filter /vggt/combined_pointcloud
    pcl_require_raw_support: false # keep VGGT cloud dense; raw depth only rejects bad pixels
    pcl_max_depth_residual: 0.0 # use relative residual parameters below
    depth_edge_rtol: 0.03
    min_pair_overlap: 0.15
    scale_min_support: 1000
    scale_max_camera_disagreement: 0.15
    publish_fused_cloud: false # excluded from final evaluation; avoids expensive voxelization
    fused_cloud_topic: "/vggt/fused_local_pointcloud"
    fused_cloud_min_depth: 0.15
    fused_cloud_max_depth: 10.0
    fused_cloud_voxel_size: 0.02
    # Metrics
    metrics_enabled: true
    metrics_csv_path: "extrinsic_metrics.csv"
    gt_parent_frame: ""
    gt_child_frame: ""

cloud_map_evaluator:
  ros__parameters:
    vggt_cloud_topic: "/vggt/combined_pointcloud"
    ground_truth_cloud_topic: "/ground_truth/visible_cloud"
    ground_truth_odom_topic: "/exoskeleton/odom"
    ground_truth_is_exo_pose: false
    voxel_size: 0.05 # 0.1 Too big voxels, 0.01 too small voxels for good evalutaion
    fscore_threshold: 0.1
    waist_to_exo_translation: [0.07, 0.0, 0.0]
    waist_to_exo_pitch_deg: 0.0

map_assembler:
  ros__parameters:
    Grid/DepthDecimation: "1"
    Grid/CellSize: "0.01"
