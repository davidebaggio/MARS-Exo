extrinsic_solver:
  ros__parameters:
    head_rgb_topic: "/head/masked/image_raw"
    head_depth_topic: "/head/masked/depth_raw"
    exo_rgb_topic: "/exo/masked/image_raw"
    exo_depth_topic: "/exo/masked/depth_raw"
    head_frame_id: "head_link"
    exo_frame_id: "exo_link"
    tf_filter_alpha: 0.5
    sliding_window_size: 4
    # VGGT depth-head confidence gating
    depth_conf_mode: "percentile"        # "percentile" | "absolute"
    depth_conf_percentile: 5.0         # drop bottom N% of pixels by conf when mode=percentile
    depth_conf_absolute: 1.5            # conf threshold when mode=absolute (range is (1, +inf))
    conf_gate_combine: true             # gate raw+VGGT depth fill by conf mask
    conf_filter_pointcloud: true        # percentile-filter /vggt/combined_pointcloud
    depth_blend_error_threshold: 0.15   # meters; camera depth is treated as GT
    depth_blend_camera_weight: 0.5     # high-error blend = 85% camera + 15% smoothed VGGT
    depth_blend_smooth_kernel: 5        # odd Gaussian kernel; <=1 disables smoothing
    # Metrics
    metrics_enabled: true
    metrics_csv_path: "extrinsic_metrics.csv"
    gt_parent_frame: ""
    gt_child_frame: ""

map_assembler:
  ros__parameters:
    Grid/DepthDecimation: "1"
    Grid/CellSize: "0.01"
