head_depth_preprocessor:
  ros__parameters:
    input_depth_topic: "/camera/head/aligned_depth_to_color/image_raw"
    output_depth_topic: "/head/filtered/depth_raw"
    expected_frame_id: "head"
    depth_filter.enabled: true
    depth_filter.depth_unit_scale: 0.001
    depth_filter.spatial.kernel_size: 5
    depth_filter.spatial.sigma_color: 0.08
    depth_filter.spatial.sigma_space: 3.0
    depth_filter.temporal.enabled: true
    depth_filter.temporal.alpha: 0.6

head_semantic_masker:
  ros__parameters:
    input_rgb_topic: "/camera/head/color/image_raw"
    input_depth_topic: "/head/filtered/depth_raw"
    expected_frame_id: "head"
    output_rgb_topic: "/head/masked/image_raw"
    output_depth_topic: "/head/masked/depth_raw"
    masker.model_path: "yolov8n-seg.pt"
    masker.conf_threshold: 0.25
    masker.dynamic_classes: [0, 1, 2, 3, 5, 7]
    sync_slop: 0.035

head_rtabmap:
  ros__parameters:
    database_path: "~/.ros/rtabmap_head.db"
    subscribe_depth: true
    frame_id: "head_link"
    map_frame_id: "map"
    odom_frame_id: "odom_head"
    publish_tf: true
    approx_sync: true
    approx_sync_max_interval: 0.02
    queue_size: 100
    sync_queue_size: 100
    wait_for_transform: 1.0
    subscribe_odom_info: true
    rgb_topic: "/head/masked/image_raw"
    depth_topic: "/head/masked/depth_raw"
    camera_info_topic: "/camera/head/color/camera_info"
    RGBD/CreateOccupancyGrid: "false"
    Grid/FromDepth: "false"
    Odom/Strategy: "0"
    Vis/EstimationType: "0"
    Vis/MinInliers: "6"
    Vis/InlierDistance: "0.1"
    Vis/CorGuessWinSize: "0"
    Vis/FeatureType: "8"
    Vis/MaxFeatures: "1000"
    Rtabmap/DetectionRate: "0"
    RGBD/LinearUpdate: "0.01"
    RGBD/AngularUpdate: "0.01"
    RGBD/OptimizeMaxError: "0.1"


head_rgbd_odometry:
  ros__parameters:
    publish_tf: true
    frame_id: "head_link"
    odom_frame_id: "odom_head"
    approx_sync: true
    approx_sync_max_interval: 0.02
    matcher_type: "lightglue"
    lightglue_device: "cuda"
    lightglue_max_keypoints: 2048


head_nvblox:
  ros__parameters:
    global_frame: "map"
    voxel_size_m: 0.05
    max_integration_distance_m: 5.0
    mesh_update_period: 10
    costmap_resolution: 0.1
    costmap_height_min: 0.0
    costmap_height_max: 1.0
    depth_topic: "/head/masked/depth_raw"
    rgb_topic: "/head/masked/image_raw"
    camera_info_topic: "/camera/head/color/camera_info"
    head_frame_id: "head_link"
